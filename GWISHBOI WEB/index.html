<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VOX ecommerce</title>
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">VOX ecommerce</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#cover">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#shop">Shop</a></li>
        <li class="nav-item"><a class="nav-link" href="#cart">Cart</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Cover Section -->
<section id="cover" class="py-5 bg-dark text-white">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-6">
        <h1 class="fw-bold">Your Trusted Sales Partner</h1>
        <p class="lead">We connect you with the best deals and personalized shopping experience.</p>
        <a href="#shop" class="btn btn-primary btn-lg">Start Shopping</a>
      </div>
      <div class="col-md-6 text-center">
        <img src="https://images.pexels.com/photos/3184292/pexels-photo-3184292.jpeg?auto=compress&cs=tinysrgb&w=600" 
             class="img-fluid rounded shadow" alt="Salesperson assisting customer">
      </div>
    </div>
  </div>
</section>

<!-- Hero -->
<section id="hero" class="py-5 text-center bg-primary text-white">
  <div class="container">
    <h1 class="fw-bold">Welcome to our store</h1>
    <p class="lead">Best deals on our products</p>
  </div>
</section>

<!-- Shop -->
<section id="shop" class="py-5">
  <div class="container">
    <h2 class="text-center mb-4">Shop</h2>
    <div class="row" id="product-grid"></div>
  </div>
</section>

<!-- Cart -->
<section id="cart" class="py-5 bg-white">
  <div class="container">
    <h2>Your Cart</h2>
    <ul id="cart-items" class="list-group mb-3"></ul>
    <p id="subtotal"></p>
    <div class="mb-3">
      <label for="coupon" class="form-label">Coupon Code</label>
      <input type="text" id="coupon" class="form-control w-25 d-inline">
      <button class="btn btn-secondary ms-2" onclick="applyCoupon()">Apply Coupon</button>
    </div>
    <p id="discount"></p>
    <p id="total" class="fw-bold"></p>
    <button class="btn btn-danger me-2" onclick="clearCart()">Clear Cart</button>
    <button class="btn btn-success" onclick="checkout()">Checkout</button>
  </div>
</section>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-3">
  &copy; 2026 VOX store
</footer>

<!-- Modal -->
<div class="modal fade" id="checkoutModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Order Summary</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="order-summary"></div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="placeOrder()">Place Order</button>
        <button class="btn btn-secondary" data-bs-dismiss="modal">Continue Shopping</button>
      </div>
    </div>
  </div>
</div>

<script>
const products = [
  {id:1,name:"Wireless Headphones",price:50,img:"https://images.pexels.com/photos/374777/pexels-photo-374777.jpeg?auto=compress&cs=tinysrgb&w=400"},
  {id:2,name:"Smartwatch",price:120,img:"https://images.pexels.com/photos/267394/pexels-photo-267394.jpeg?auto=compress&cs=tinysrgb&w=400"},
  {id:3,name:"Laptop",price:800,img:"https://images.pexels.com/photos/18105/pexels-photo.jpg?auto=compress&cs=tinysrgb&w=400"},
  {id:4,name:"DSLR Camera",price:650,img:"https://images.pexels.com/photos/212372/pexels-photo-212372.jpeg?auto=compress&cs=tinysrgb&w=400"},
  {id:5,name:"Running Sneakers",price:75,img:"https://images.pexels.com/photos/2529148/pexels-photo-2529148.jpeg?auto=compress&cs=tinysrgb&w=400"},
  {id:6,name:"Leather Handbag",price:95,img:"https://images.pexels.com/photos/322207/pexels-photo-322207.jpeg?auto=compress&cs=tinysrgb&w=400"},
  {id:7,name:"Winter Jacket",price:110,img:"https://images.pexels.com/photos/428340/pexels-photo-428340.jpeg?auto=compress&cs=tinysrgb&w=400"},
  {id:8,name:"Sunglasses",price:35,img:"https://images.pexels.com/photos/157888/pexels-photo-157888.jpeg?auto=compress&cs=tinysrgb&w=400"},
  {id:9,name:"Wooden Chair",price:60,img:"https://images.pexels.com/photos/276528/pexels-photo-276528.jpeg?auto=compress&cs=tinysrgb&w=400"},
  {id:10,name:"Table Lamp",price:40,img:"https://images.pexels.com/photos/1125133/pexels-photo-1125133.jpeg?auto=compress&cs=tinysrgb&w=400"},
  {id:11,name:"Ceramic Coffee Mug",price:15,img:"https://images.pexels.com/photos/585752/pexels-photo-585752.jpeg?auto=compress&cs=tinysrgb&w=400"},
  {id:12,name:"Cutlery Set",price:35,img:"https://images.pexels.com/photos/276528/pexels-photo-276528.jpeg?auto=compress&cs=tinysrgb&w=400"},
  {id:13,name:"Bluetooth Speaker",price:55,img:"https://images.pexels.com/photos/63703/pexels-photo-63703.jpeg?auto=compress&cs=tinysrgb&w=400"},
  {id:14,name:"Office Desk",price:250,img:"https://images.pexels.com/photos/245032/pexels-photo-245032.jpeg?auto=compress&cs=tinysrgb&w=400"},
  {id:15,name:"Wall Clock",price:45,img:"https://images.pexels.com/photos/707676/pexels-photo-707676.jpeg?auto=compress&cs=tinysrgb&w=400"},
  {id:16,name:"Backpack",price:70,img:"https://images.pexels.com/photos/374777/pexels-photo-374777.jpeg?auto=compress&cs=tinysrgb&w=400"},
  {id:17,name:"Desk Plant",price:25,img:"https://images.pexels.com/photos/3076899/pexels-photo-3076899.jpeg?auto=compress&cs=tinysrgb&w=400"},
  {id:18,name:"Gaming Mouse",price:45,img:"https://images.pexels.com/photos/394565/pexels-photo-394565.jpeg?auto=compress&cs=tinysrgb&w=400"},
  {id:19,name:"Smart TV",price:900,img:"https://images.pexels.com/photos/572056/pexels-photo-572056.jpeg?auto=compress&cs=tinysrgb&w=400"},
  {id:20,name:"Wireless Keyboard",price:65,img:"https://images.pexels.com/photos/3825581/pexels-photo-3825581.jpeg?auto=compress&cs=tinysrgb&w=400"}
];

let cart = [];
let discountValue = 0;

const grid = document.getElementById("product-grid");
  grid.innerHTML = products.map(p => `
  <div class="col-md-3 mb-4">
    <div class="card h-100 shadow-sm">
      <img src="${p.img}" class="card-img-top" alt="${p.name}">
      <div class="card-body text-center">
        <h5 class="card-title">${p.name}</h5>
        <p class="card-text">$${p.price}</p>
        <button class="btn btn-primary" onclick="addToCart(${p.id},'${p.name}',${p.price},'${p.img}')">Add to Cart</button>
      </div>
    </div>
  </div>
`).join('');

function updateCart(){
  const list = document.getElementById("cart-items");
  list.innerHTML="";
  let subtotal=0;
  cart.forEach(item=>{
    subtotal += item.price*item.qty;
    list.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">
      ${item.name} x ${item.qty} = $${item.price*item.qty}
      <div>
        <button class="btn btn-sm btn-outline-secondary" onclick="changeQty(${item.id},1)">+</button>
        <button class="btn btn-sm btn-outline-secondary" onclick="changeQty(${item.id},-1)">-</button>
        <button class="btn btn-sm btn-outline-danger" onclick="removeItem(${item.id})">Remove</button>
      </div>
    </li>`;
  });
  document.getElementById("subtotal").innerText="Subtotal: $"+subtotal;
  let total = subtotal - discountValue;
  document.getElementById("discount").innerText = discountValue>0 ? "Discount: -$"+discountValue : "";
  document.getElementById("total").innerText="Total: $"+(total<0?0:total);
}

function addToCart(id,name,price,img){
  let item = cart.find(p=>p.id===id);
  if(item){ item.qty++; }
  else { cart.push({id,name,price,qty:1,img}); }
  updateCart();
}

function removeItem(id){ cart = cart.filter(p=>p.id!==id); updateCart(); }

function changeQty(id,delta){
  let item = cart.find(p=>p.id===id);
  if(item){ item.qty += delta; if(item.qty<=0){ removeItem(id); } }
  updateCart();
}

function applyCoupon(){
  let code = document.getElementById("coupon").value.trim().toUpperCase();
  let subtotal = cart.reduce((sum,item)=>sum+item.price*item.qty,0);
  if(code==="SAVE10"){ discountValue = 10; alert("Coupon applied: $10 off!"); }
  else if(code==="HALFPRICE"){ discountValue = subtotal/2; alert("Coupon applied: 50% off!"); }
  else { discountValue = 0; alert("Invalid coupon code."); }
  updateCart();
}

function clearCart(){ cart=[]; discountValue=0; updateCart(); alert("Cart cleared!"); }

function checkout(){
  if(cart.length===0){ alert("Your cart is empty!"); return; }
  let summaryHTML = "<ul class='list-group'>";
  let subtotal = 0;
  cart.forEach(item=>{
    subtotal += item.price*item.qty;
    summaryHTML += `<li class="list-group-item"><img src="${item.img}" alt="${item.name}" width="50" class="me-2"> 
      ${item.name} x ${item.qty} = $${item.price*item.qty}</li>`;
  });
  summaryHTML += "</ul>";
  summaryHTML += `<p>Subtotal: $${subtotal}</p>`;
  if(discountValue>0){ summaryHTML += `<p>Discount: -$${discountValue}</p>`; }
  let total = subtotal - discountValue;
  summaryHTML += `<p><strong>Total: $${(total<0?0:total)}</strong></p>`;
  document.getElementById("order-summary").innerHTML = summaryHTML;
  new bootstrap.Modal(document.getElementById("checkoutModal")).show();
}

function placeOrder(){ alert("Order placed successfully!"); clearCart(); }
</script>
